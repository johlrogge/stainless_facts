[package]
name = "stainless-facts"
version = "0.2.0"
edition = "2021"
authors = ["Joakim Ohlrogge"]
license = "MIT OR Apache-2.0"
description = "A simple, immutable fact stream library inspired by Datomic with support for I/O and aggregation"
repository = "https://github.com/johlrogge/stainless-facts"
documentation = "https://docs.rs/stainless-facts"
readme = "README.md"
keywords = ["facts", "event-sourcing", "datomic", "immutable", "schema-evolution"]
categories = ["data-structures", "database"]
rust-version = "1.85"

[features]
default = []
# Enable FactStore and synchronous file I/O
io = ["dep:fs2", "dep:parking_lot"]
# Enable async I/O with tokio (implies io)
tokio = ["io", "dep:tokio"]

[dependencies]
# Core dependencies (always included)
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
thiserror = "1.0"

# Sync I/O dependencies (only with io feature)
fs2 = { version = "0.4", optional = true }
parking_lot = { version = "0.12", optional = true }

# Async I/O dependencies (only with tokio feature)
tokio = { version = "1", features = ["fs", "io-util", "time", "rt-multi-thread", "macros"], optional = true }

[dev-dependencies]
rstest = "0.26"
tempfile = "3.8"
tokio = { version = "1", features = ["macros", "rt"] }
# Capped below 1.12 to keep the MSRV at 1.85 (proptest 1.12 requires Rust 1.88)
proptest = ">=1.5, <1.12"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "basic_usage"
required-features = ["io"]

[[example]]
name = "incremental_sync"
required-features = ["io"]

[[example]]
name = "async_basic_usage"
required-features = ["tokio"]
