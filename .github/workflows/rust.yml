name: Rust

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Test each feature set: core only (no features), sync I/O, and async I/O
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta, nightly, 1.99.0]
        features:
          - { name: core, flags: "" }
          - { name: io, flags: "--features io" }
          - { name: tokio, flags: "--features tokio" }
    name: test-${{ matrix.features.name }}-${{ matrix.rust }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    - name: Build
      run: cargo build ${{ matrix.features.flags }} --verbose
    - name: Test
      run: cargo test ${{ matrix.features.flags }} --verbose

  # Clippy on each feature set, including tests and examples
  clippy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - { name: core, flags: "" }
          - { name: io, flags: "--features io" }
          - { name: tokio, flags: "--features tokio" }
    name: clippy-${{ matrix.features.name }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Clippy
      run: cargo clippy --all-targets ${{ matrix.features.flags }} -- -D warnings

  # Core (no features) must build for wasm32
  wasm-core:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Check core for wasm32
      run: cargo check --target wasm32-unknown-unknown

  # Format check
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Check formatting
      run: cargo fmt -- --check

  # Documentation
  doc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Check documentation
      env:
        RUSTDOCFLAGS: -D warnings
      run: |
        cargo doc --no-deps
        cargo doc --all-features --no-deps
